[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
# E501 ignored because prompt templates, SQL strings, regexes, URLs, and JSON schemas intentionally exceed 120 characters
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# app.py: Streamlit requires st.set_page_config() and asset/theme path configuration before importing UI modules
"app.py" = ["E402"]
# cli.py: Requires sys.path.insert(0, current_dir) to resolve repo root before importing project modules
"cli.py" = ["E402"]
# api.py: Requires sys.path.insert(0, current_dir) to resolve repo root before importing project modules
"api.py" = ["E402"]
# tests/test_login_ui.py: Requires sys.path.insert(0, root_dir) to resolve test targets before importing login_ui
"tests/test_login_ui.py" = ["E402"]
# tests/test_profile_ui.py: Requires sys.path.insert(0, root_dir) to resolve test targets before importing profile_ui
"tests/test_profile_ui.py" = ["E402"]
# alembic/**: Auto-generated migration templates include boilerplate op and sa imports
"alembic/**" = ["F401"]

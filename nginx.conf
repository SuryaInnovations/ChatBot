events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    upstream fastapi_cluster {
        least_conn;
        server api:8000 max_fails=3 fail_timeout=10s;
    }

    upstream streamlit_cluster {
        ip_hash; # Sticky sessions required for Streamlit WebSockets
        server web:8501 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        # Health checks
        location /health/live {
            proxy_pass http://fastapi_cluster/health/live;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Stateless FastAPI Backend API
        location /api/ {
            proxy_pass http://fastapi_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # Swagger Docs
        location /docs {
            proxy_pass http://fastapi_cluster/docs;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass http://fastapi_cluster/openapi.json;
            proxy_set_header Host $host;
        }

        # Streamlit Web UI + WebSocket Support
        location / {
            proxy_pass http://streamlit_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Streamlit WebSocket endpoint
        location /_stcore/stream {
            proxy_pass http://streamlit_cluster/_stcore/stream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}

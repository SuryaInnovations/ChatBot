services:
  spark-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-ai-app
    ports:
      - "8501:8501"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - SANDBOX_TIMEOUT_SECONDS=6.0
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./artifacts:/app/artifacts
      - ./user_memory.db:/app/user_memory.db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

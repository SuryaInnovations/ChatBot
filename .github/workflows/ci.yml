name: SPARK-AI CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    # Note: Local development runs Python 3.14.7 (preview/PEP 484 no-implicit-optional).
    # CI tests against production LTS Python 3.11 and 3.12 supported by GitHub Actions runner environments.
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies from Hash-Pinned Lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install ruff mypy pip-audit

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Type Check with MyPy
        run: |
          mypy core tools db app.py tests --ignore-missing-imports

      - name: Dependency Vulnerability Audit
        run: |
          pip-audit --desc on

      - name: Run Pytest Suite (All Tests)
        run: |
          python -m pytest tests/ -v

      - name: Run 100-Question Quality Eval Benchmark
        run: |
          python -m pytest tests/eval_suite.py -v

name: SPARK-AI CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    env:
      ALLOW_UNSAFE_SUBPROCESS: "1"
      CI: "true"
      PYTHONPATH: "."
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pip-audit pytest pytest-asyncio

      - name: Lint with Ruff
        run: |
          ruff check . --exit-zero

      - name: Type Check with MyPy
        run: |
          mypy core tools db app.py tests --ignore-missing-imports || true

      - name: Dependency Vulnerability Audit
        run: |
          pip-audit --desc on || true

      - name: Run Pytest Suite
        run: |
          python -m pytest tests/ -v

      - name: Run 100-Question Quality Eval Benchmark
        run: |
          python -m pytest tests/eval_suite.py -v
